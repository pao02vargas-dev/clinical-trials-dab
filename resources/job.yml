resources:
  jobs:
    clinical_trials_orchestration_job:
      name: "Clinical Trials Orchestration Job (${bundle.target}) - Paola Vargas"
      email_notifications:
        on_success:
          - ${var.notification_email}
        on_failure:
          - ${var.notification_email}
      tasks:
        # Tarea 1: Ejecutar el pipeline SDP (Bronze -> Silver -> Gold)
        - task_key: run_sdp_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.clinical_trials_pipeline.id}

        # Tarea 2: Verifica el conteo de filas en Gold
        - task_key: verify_gold_rows
          depends_on:
            - task_key: run_sdp_pipeline
          notebook_task:
            notebook_path: ../src/check_gold_rows.py
            base_parameters:
              gold_table: "${var.catalog}.${var.schema}.trials_gold"

        # Tarea 3: If/Else condicional (row_count > 0)
        - task_key: gold_has_rows
          depends_on:
            - task_key: verify_gold_rows
          condition_task:
            left: "{{tasks.verify_gold_rows.values.row_count}}"
            op: GREATER_THAN
            right: "0"

        # Rama TRUE: la capa Gold está publicada
        - task_key: gold_published_ok
          depends_on:
            - task_key: gold_has_rows
              outcome: "true"
          notebook_task:
            notebook_path: ../src/job_gate.py
            base_parameters:
              status: "success"
              gold_table: "${var.catalog}.${var.schema}.trials_gold"

        # Rama FALSE: falla el job de forma explícita
        - task_key: gold_empty_abort
          depends_on:
            - task_key: gold_has_rows
              outcome: "false"
          notebook_task:
            notebook_path: ../src/job_gate.py
            base_parameters:
              status: "empty"
              gold_table: "${var.catalog}.${var.schema}.trials_gold"