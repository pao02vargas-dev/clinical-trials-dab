resources:
  jobs:
    clinical_trials_orchestration_job:
      name: "Clinical Trials Orchestration Job (${bundle.target}) - Paola Vargas"
      email_notifications:
        on_success:
          - ${var.notification_email}
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: gold_table
          default: ${var.catalog}.${var.schema}.trials_gold
      tasks:
        # Tarea 1: ejecutar el pipeline SDP (Bronze -> Silver -> Gold)
        - task_key: run_sdp_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.clinical_trials_pipeline.id}

        # Verifica el conteo de filas en Gold y lo expone como task value
        - task_key: verify_gold_rows
          depends_on:
            - task_key: run_sdp_pipeline
          spark_python_task:
            python_file: ../src/check_gold_rows.py
            parameters:
              - "{{job.parameters.gold_table}}"

        # Tarea 2: If/Else condicional (row_count > 0)
        - task_key: gold_has_rows
          depends_on:
            - task_key: verify_gold_rows
          condition_task:
            left: "{{tasks.verify_gold_rows.values.row_count}}"
            op: GREATER_THAN
            right: "0"

        # Rama TRUE: la capa Gold está publicada
        - task_key: gold_published_ok
          depends_on:
            - task_key: gold_has_rows
              outcome: "true"
          spark_python_task:
            python_file: ../src/job_gate.py
            parameters:
              - "success"
              - "{{job.parameters.gold_table}}"

        # Rama FALSE: falla el job de forma explícita
        - task_key: gold_empty_abort
          depends_on:
            - task_key: gold_has_rows
              outcome: "false"
          spark_python_task:
            python_file: ../src/job_gate.py
            parameters:
              - "empty"
              - "{{job.parameters.gold_table}}"
